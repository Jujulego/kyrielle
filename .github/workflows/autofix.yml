name: autofix.ci

on: [pull_request]

jobs:
  autofix:
    name: 'Autofix'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Prettier
        run: yarn run format:write

      - name: Lint
        run: yarn lint --fix

      - name: Autofix
        uses: autofix-ci/action@v1